# Маршрутник — сайт для nginx на Windows.
# Подключается в nginx.conf внутри блока http { ... }:
#     include sites/marshrutnik.conf;
# Замените marshrutnik.ru на ваш домен и пути C:/sites/..., C:/nginx/... на свои.
# В путях nginx на Windows пишите прямые слэши: C:/sites/marshrutnik

# --- HTTP: проверка Let's Encrypt и перенаправление на HTTPS ---
server {
    listen 80;
    server_name marshrutnik.ru www.marshrutnik.ru;
    root C:/sites/marshrutnik;

    # сюда win-acme кладёт проверочные файлы при выпуске сертификата
    location /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    # ШАГ 1 (сертификата ещё нет): оставьте эти две строки, а return ниже закомментируйте
    index index.html;
    location / { try_files $uri $uri/ =404; }

    # ШАГ 2 (сертификат выпущен): закомментируйте две строки выше и раскомментируйте эту
    # location / { return 301 https://marshrutnik.ru$request_uri; }
}

