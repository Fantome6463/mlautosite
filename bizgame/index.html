<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>БизСити 3D — экономическая стратегия</title>
  <meta name="description" content="Браузерная экономическая стратегия в 3D: застраивайте пустой город, стройте офисы, жилые дома, больницы и полицию, налаживайте производство.">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
  <div id="app">
    <header id="hdr">
      <div class="logo">
        <b>БИЗ<span>$</span>ИТИ <i>3D</i></b>
        <small>экономическая стратегия</small>
        <small>до нового дня ~ <b id="dayLeft">—</b></small>
      </div>
      <div class="who">
        <div>Компания: <b id="hdrCompany">—</b> · <a href="#" data-page="settings">настройки</a></div>
        <div>Деньги: <b id="money">—</b> · Капитал: <b id="worth">—</b> · Население: <b id="pop">—</b></div>
        <div>Дата: <b id="date">—</b></div>
      </div>
    </header>

    <nav id="toolbar">
      <button data-page="city" title="Город (3D)"><i>🌐</i></button>
      <span class="sep"></span>
      <button data-page="company" data-tab="main" title="Компания"><i>🏢</i></button>
      <button data-page="company" data-tab="ent" title="Предприятия"><i>🏭</i></button>
      <button data-page="company" data-tab="staff" title="Специалисты"><i>🧑‍💼</i></button>
      <button data-page="builds" title="Стройки"><i>🏗️</i></button>
      <span class="sep"></span>
      <button data-page="company" data-tab="finance" title="Финансы"><i>💲</i></button>
      <button data-page="market" title="Рынок"><i>💹</i></button>
      <button data-page="contracts" title="Поставки"><i>🚚</i></button>
      <button data-page="rating" title="Рейтинг"><i>🏆</i></button>
      <button data-page="quests" title="Задания"><i>📝</i><em id="questDot"></em></button>
      <button data-page="company" data-tab="reports" title="Отчёты"><i>📋</i></button>
      <span class="grow"></span>
      <button data-page="help" title="Как играть"><i>❔</i></button>
      <button data-page="settings" title="Настройки"><i>⚙️</i></button>
    </nav>

    <main id="main">
      <div id="cityHolder" hidden>
        <div id="cityView"><div id="scene"></div><div id="badges"></div><div id="labels"></div></div>
      </div>
      <section id="page"><div id="pageBody"></div></section>
      <aside id="side" hidden></aside>
      <div id="toasts"></div>
    </main>

    <footer id="bottombar">
      <button data-page="city" title="Город"><i>🌐</i></button>
      <button data-page="company" data-tab="main" title="Компания"><i>🏢</i></button>
      <button data-page="company" data-tab="ent" title="Предприятия"><i>🏭</i></button>
      <button data-page="builds" title="Стройки"><i>🏗️</i></button>
      <button data-page="company" data-tab="reports" title="Новости и отчёты"><i>✉️</i></button>
      <div id="news"></div>
      <div class="speed" id="speed">
        <button data-speed="0" title="Пауза (пробел)">⏸</button>
        <button data-speed="1" title="Обычная скорость">▶</button>
        <button data-speed="2" title="Быстрее ×2">⏩</button>
        <button data-speed="4" title="Быстрее ×4">⏭</button>
      </div>
    </footer>

    <div id="loading">Строим город…</div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
