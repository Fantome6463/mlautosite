<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>БизСити 3D — экономическая стратегия</title>
  <meta name="description" content="Браузерная экономическая стратегия в 3D: застраивайте пустой город, стройте офисы, жилые дома, больницы и полицию, налаживайте производство.">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
  <div id="app">
    <header id="hdr">
      <div class="logo" title="БизСити 3D — экономическая стратегия"><span class="mark">Б</span><b>Биз<span>Сити</span></b><i>3D</i></div>
      <div class="stats">
        <div class="stat co" title="Компания и её уровень"><span class="star sm" id="compLvl">1</span><div><small>Компания</small><b id="hdrCompany">—</b></div></div>
        <div class="stat" title="Деньги на счёте" data-ic="wallet"><div><small>Деньги</small><b id="money">—</b></div></div>
        <div class="stat hide-s" title="Капитал компании" data-ic="coins"><div><small>Капитал</small><b id="worth">—</b></div></div>
        <div class="stat hide-s" title="Население города" data-ic="people"><div><small>Население</small><b id="pop">—</b></div></div>
        <div class="stat day" title="Игровая дата и время до нового дня" data-ic="clock"><div><small id="date">—</small><b><span class="daybar"><i id="dayBar"></i></span><span id="dayLeft">—</span></b></div></div>
      </div>
    </header>

    <nav id="toolbar">
      <button data-page="city" data-ic="globe"><span>Город</span></button>
      <button data-page="company" data-tab="main" data-ic="briefcase"><span>Компания</span></button>
      <button data-page="company" data-tab="ent" data-ic="factory"><span>Предприятия</span></button>
      <button data-page="company" data-tab="staff" data-ic="users"><span>Специалисты</span></button>
      <button data-page="builds" data-ic="crane"><span>Стройки</span></button>
      <button data-page="company" data-tab="finance" data-ic="wallet"><span>Финансы</span></button>
      <button data-page="company" data-tab="reports" data-ic="report"><span>Отчёты</span></button>
      <button data-page="market" data-ic="trend"><span>Рынок</span></button>
      <button data-page="contracts" data-ic="truck"><span>Поставки</span></button>
      <button data-page="rating" data-ic="trophy"><span>Рейтинг</span></button>
      <button data-page="quests" data-ic="tasks"><span>Задания</span><em id="questDot"></em></button>
      <span class="grow"></span>
      <button class="ico" data-page="help" data-ic="help" title="Как играть"></button>
      <button class="ico" data-page="settings" data-ic="settings" title="Настройки"></button>
    </nav>

    <main id="main">
      <div id="cityHolder" hidden>
        <div id="cityView"><div id="scene"></div><div id="badges"></div><div id="labels"></div></div>
      </div>
      <section id="page"><div id="pageBody"></div></section>
      <aside id="side" hidden></aside>
      <div id="toasts"></div>
    </main>

    <footer id="bottombar">
      <a href="#" id="newsWrap" data-page="company" data-tab="reports" data-rep="news" data-ic="bell" title="Все новости компании"><span id="news"></span></a>
      <div class="speed" id="speed">
        <button data-speed="0" data-ic="pause" title="Пауза (пробел)"></button>
        <button data-speed="1" data-ic="play" title="Обычная скорость"></button>
        <button data-speed="2" data-ic="ff" title="Быстрее ×2"></button>
        <button data-speed="4" data-ic="fff" title="Быстрее ×4"></button>
      </div>
    </footer>

    <div id="loading"><span class="mark">Б</span>Строим город…</div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
